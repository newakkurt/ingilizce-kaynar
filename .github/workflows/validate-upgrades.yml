name: Validate safe upgrades
on:
  pull_request:
  workflow_dispatch:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile bot module
        run: python -m py_compile main.py
