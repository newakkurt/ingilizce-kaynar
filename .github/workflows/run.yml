name: Telegram Bot Runner

on:
  schedule:
    # Türkiye saatiyle 09:00, 13:00, 17:00, 21:00
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch:

concurrency:
  group: english-learning-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Öğrenme geçmişini geri yükle
      uses: actions/cache@v4
      with:
        path: learning_state.json
        key: english-learning-state-${{ github.run_id }}
        restore-keys: |
          english-learning-state-

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Paketleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests gTTS google-genai python-telegram-bot

    - name: Python Kodunu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py
