name: Telegram Bot Runner

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Türkiye saatiyle 09:00, 13:00, 17:00, 21:00
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Paketleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests gTTS google-genai

    - name: Python Kodunu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py
