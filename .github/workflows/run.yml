name: Telegram Bot Runner

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Türkiye saatiyle (UTC+3) her gün 09:00, 13:00, 17:00 ve 21:00'de çalışır.
    # UTC karşılıkları: 06:00, 10:00, 14:00, 18:00
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Paketleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install requests gTTS

    - name: Python Kodunu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
